<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tabletop Tasks - A Meta-Game for Game Night</title>
    <!-- Opt in to the operating system's text size setting (ignored where unsupported). -->
    <meta name="text-scale" content="scale">
    <!-- Both themes are supported; declared early so the first paint isn't a white flash. -->
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#c8daeb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#14202d" media="(prefers-color-scheme: dark)">
    <link rel="preload" href="fonts/ibm-plex-serif-latin-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/ibm-plex-serif-latin-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="tasks.css">
</head>
<body>
    <header>
        <h1 id="header">Tabletop Tasks</h1>
        <p class="goal" id="goal"></p>
    </header>

    <main>
        <noscript><p class="noscript">Tabletop Tasks needs JavaScript to deal your cards.</p></noscript>

        <ul class="cards" id="cards" role="list"></ul>

        <div class="actions">
            <a id="new-card" href="./"></a>
        </div>

        <section class="how_to_play">
            <h2 id="how-to-play-header"></h2>
            <ul id="how-to-play"></ul>
        </section>

        <section class="qrcode">
            <h2 id="invite"></h2>
            <div class="qr">
                <img src="images/qrcode-tabletop-tasks.png" width="220" height="220" loading="lazy" decoding="async" alt="QR code linking to Tabletop Tasks">
            </div>
        </section>
    </main>

    <footer class="footer">
        <p><span id="footer"></span>Ryan Loudfoot &middot; <a href="https://www.github.com/Elyrith" target="_blank" rel="noopener">GitHub</a></p>
    </footer>

    <script src="tasks.js"></script>
</body>
</html>
