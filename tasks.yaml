tasks:
  - "Tell someone you've lost your phone and get them to use theirs to call it."
  - "Get someone to show you a picture of their pet."
  - "Get someone to help you find a good restaurant nearby."
  - "Get someone to take a photo of you with your camera/phone."
  - "Get someone to help you with directions to somewhere."
  - "Get someone to recommend a good movie."
  - "Get someone to lend you a pen or pencil."
  - "Get someone to teach you how to say 'hello' in another language."
  - "Get someone to hold your drink while you 'tie your shoe' (even if you're not wearing laces)."
  - "Convince someone to swap seats with you just because 'it has better vibes.'"
  - "Get someone to high-five you twice in under 10 seconds."
  - "Get someone to fist-bump you and then immediately go for a high-five."
  - "Convince someone to stand up and then sit back down with you for no reason."
  - "Get someone to pretend to pose like a statue while you take a picture."
