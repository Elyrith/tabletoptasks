<!DOCTYPE html>
<html>
<head>
    <title>Task Cards</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;700&display=swap" rel="stylesheet">
    <style>{{ css }}</style>
</head>
<body>
    <h1>{{ header }}</h1>
    {% for task in tasks %}
    <div class="card" onclick="toggleTask(this)">{{ task }}</div>
    {% endfor %}
    <div class="button-container">
        <button id="mark-complete-btn" class="complete-btn" onclick="markComplete()" disabled>Mark Completed</button>
        <button id="mark-failed-btn" class="failed-btn" onclick="markFailed()" disabled>Mark Failed</button>
        <button id="reset-btn" class="reset-btn" onclick="resetCard()" disabled>Reset Card</button>
    </div>
    <script>{{ js }}</script>
</body>
</html>
