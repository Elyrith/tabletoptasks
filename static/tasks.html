<!DOCTYPE html>
<html>
<head>
    <title>Task Cards</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;700&display=swap" rel="stylesheet">
    <style>{{ css }}</style>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <h1>{{ header }}</h1>
    <h2 class="goal">{{ goal }}</h2>
    {% for task in tasks %}
    <div class="card" onclick="toggleTask(this)">{{ task }}</div>
    {% endfor %}
    <div class="button-container">
        <button class="complete-btn" onclick="markComplete()">Mark Complete</button>
        <!--button class="failed-btn" onclick="markFailed()">Mark Failed</button-->
        <button class="reset-btn" onclick="resetCard()">Reset Card</button>
    </div>
    <script>{{ js }}</script>
    <div class="footer_container">
        <div class="how_to_play">
            <h2>{{ how_to_play_header }}</h2>
            <ul>
                {% for rule in how_to_play %}
                <li>{{ rule }}</li>
                {% endfor %}
            </ul>
        </div>
    </div>
    <div class="footer">
        <p>{{ footer }}Ryan Loudfoot</p>
        <p><a href="https://www.github.com/Elyrith" target="_blank">GitHub</a></p>
    </div>

    <!-- Creator support stuff -->
    <script src='https://storage.ko-fi.com/cdn/scripts/overlay-widget.js'></script>
    <script>
    kofiWidgetOverlay.draw('elyrith', {
        'type': 'floating-chat',
        'floating-chat.donateButton.text': '{{ support_prefix }} Ryan',
        'floating-chat.donateButton.background-color': '#fc7c00',
        'floating-chat.donateButton.text-color': '#fff'
    });
    </script>
</body>
</html>
