<!DOCTYPE html>
<html>
<head>
    <title>Task Cards</title>
    <style>{{ css }}</style>
</head>
<body>
    <h1>{{ header }}</h1>
    {% for task in tasks %}
    <div class="card" onclick="toggleTask(this)">{{ task }}</div>
    {% endfor %}
    <div class="button-container">
        <button class="caught-btn" onclick="markCaught()">Mark Caught</button>
        <button class="complete-btn" onclick="markComplete()">Mark Complete</button>
        <button class="reset-btn" onclick="resetCard()">Reset</button>
    </div>
    <script>{{ js }}</script>
</body>
</html>
